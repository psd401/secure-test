name: CodeQL

# Advanced setup, replacing CodeQL default setup (2026-11-02): default setup
# analyzed Swift on a macOS runner (~11 min) on every push and pull request,
# OpenWiki bot PRs included. The languages that run on Linux stay here on every
# change; Swift moved to codeql-swift.yml, which runs only when Swift changes.
# Same query suite as default setup had (extended).
#
# Actions are pinned by commit SHA (the tag in the comment), like ci.yml.

# No push trigger (org standard 06 §4): main's baseline comes from the weekly
# run, so it is at most a week old when a pull request is compared with it.
on:
  pull_request:
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
