name: OpenWiki Update
on:
  workflow_dispatch:
  # No `push` trigger: since reusable-openwiki v1.2.2 a push run skips its
  # job unless run_on_push is set, so the wiki rebuilds weekly (James,
  # 2026-11-17: weekly accepted to save Actions minutes and bot PRs).
  schedule:
    - cron: "0 8 * * 1"

# Several merges in a row would otherwise queue a full wiki regeneration each;
# only the last one's output survives anyway.
concurrency:
  group: openwiki
  cancel-in-progress: true

jobs:
  openwiki:
    # Forks have neither the org's reusable-workflow access nor its secrets,
    # so the run would fail there on every push. Comparison is case-insensitive.
    if: github.repository == 'psd401/secure-test'
    permissions:
      contents: write # caller must grant; org default token is read-only
      pull-requests: write
    uses: PSD401/.github/.github/workflows/reusable-openwiki.yml@bf041d7e251023502d143a5af3b19bdf449ac65c # v1.22.4
    with:
      base_branch: main
    secrets:
      BEDROCK_API_KEY: ${{ secrets.BEDROCK_API_KEY }}
      PSD_AUTOMATION_APP_PRIVATE_KEY: ${{ secrets.PSD_AUTOMATION_APP_PRIVATE_KEY }}
