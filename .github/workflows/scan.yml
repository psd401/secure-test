name: scan

# Two gates on every push and pull request: gitleaks over the whole history
# with the repo's identifier-aware config, and a grep sweep for the patterns
# gitleaks cannot shape (a hostname, a person's name). The sweep list lives in
# .github/identifier-sweep.txt (shared with .githooks/pre-commit) and mirrors
# CLAUDE.md's "Contributing / what stays out of this repo".

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: gitleaks over the full history
        run: gitleaks git --config .gitleaks.toml --no-banner --redact .
      - name: gitleaks over the tree
        run: gitleaks dir --config .gitleaks.toml --no-banner --redact .

  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Identifier sweep over tracked files
        run: |
          set -u
          fail=0
          # Patterns and excluded paths live in .github/identifier-sweep.txt,
          # shared with .githooks/pre-commit.
          sweep=.github/identifier-sweep.txt
          excludes=()
          while read -r kind rest; do
            if [ "$kind" = exclude ]; then excludes+=(":!$rest"); fi
          done < "$sweep"
          while read -r kind p; do
            [ "$kind" = pattern ] || continue
            hits=$(git grep -nIE -- "$p" -- "${excludes[@]}" || true)
            if [ -n "$hits" ]; then
              echo "::error::pattern matched: $p"; echo "$hits"; fail=1
            fi
          done < "$sweep"
          exit $fail
