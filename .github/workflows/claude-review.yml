name: Claude Review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
jobs:
  claude-review:
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write # caller must grant; org default token is read-only and reusables cannot elevate
    # Dependabot-triggered callers cannot grant id-token: write to the
    # reusable — startup_failure. The reusable also self-guards; both needed.
    if: github.actor != 'dependabot[bot]'
    uses: PSD401/.github/.github/workflows/reusable-claude-review.yml@1aa5f5351a78b15f5c71668037f5d35b9613ae41 # v1.0.0
    secrets:
      BEDROCK_API_KEY: ${{ secrets.BEDROCK_API_KEY }}
