# Keeps SHA-pinned `uses:` refs current (psd-dev-standards standards/06 §4 Pinning).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # init and analyze must be the same CodeQL version; one PR per action
    # left each half failing CodeQL on its own (#208/#209, 2026-11-13).
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
